<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hazmat Orders → FedEx CSV</title>

  <!-- Handsontable CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@11.1.0/dist/handsontable.full.min.css"/>

  <style>
    :root {
      --fg: #2b2f33;
      --muted: #6c757d;
      --brand: #0d6efd;
      --bg: #f8f9fa;
      --chip: #e9ecef;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--fg); margin: 0; background: #fff; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px 24px 28px; }

    /* header/nav (unchanged look) */
    .nav_v1_header_wrapper {
      max-width: 1200px; margin: 0 auto; padding: 0 2rem;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
    }
    .nav_v1_header_links { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .nav_v1_header_link { text-decoration: none; color: #495057; font-size: .9rem; padding: .5rem .75rem; border-radius: 4px; transition: .2s; }
    .nav_v1_header_link:hover { background:#f8f9fa; color:#007bff; }
    .nav_v1_header_logout { background: #dc3545; color: #fff !important; padding: .5rem 1rem; border-radius: 4px; text-decoration: none; font-size: .9rem; }

    /* toolbar */
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 14px 0 8px;
    }
    .toolbar-left {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    }
    .toolbar .group { display: flex; align-items: center; gap: 8px; }
    label.small { color: var(--muted); font-size: .85rem; }
    select, input[type="text"] {
      height: 34px; padding: 6px 10px; border: 1px solid #e0e3e7; border-radius: 8px; outline: none;
    }
    input[type="text"] { width: 260px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      background: var(--chip); color: #495057; padding: 6px 10px; border-radius: 999px; cursor: pointer; user-select: none; font-size: .85rem;
      border: 1px solid transparent;
    }
    .chip.active { background: #e7f1ff; color: #0b5ed7; border-color: #cfe2ff; }
    .muted { color: var(--muted); }

    .actions { display: flex; gap: 8px; }
    button, .btn {
      height: 36px; padding: 6px 12px; border-radius: 8px; border: 1px solid #e0e3e7; background: #fff; cursor: pointer;
    }
    .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }

    /* handsontable polish */
    .ht_clone_top.handsontable { box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .badge {
      display:inline-block; padding:2px 6px; border-radius:10px; font-size:.78rem; line-height:1.2; font-weight:600;
    }
    .badge.overdue { background:#ffe3e3; color:#a61b1b; }
    .badge.today   { background:#fff4e6; color:#d9480f; }
    .badge.soon    { background:#e6fcf5; color:#087f5b; }

    .footer {
      display:flex; gap:12px; align-items:center; justify-content: space-between;
      color: var(--muted); font-size: .9rem; margin-top: 8px;
    }
  </style>
</head>
<body>
  <nav class="nav_v1_header">
    <div class="nav_v1_header_wrapper">
      <div class="nav_v1_header_links">
        <a href="/verified" class="nav_v1_header_link">Home</a>
        <a href="/hazmat_shipping" class="nav_v1_header_link">Hazmat Shipping</a>
        <a href="/hazmat_manager" class="nav_v1_header_link">Hazmat Manager</a>
        <a href="/search-page" class="nav_v1_header_link">Search Orders</a>
        <a href="/website-cs" class="nav_v1_header_link">Website CS</a>
      </div>
      <a href="/logout" class="nav_v1_header_logout">Logout</a>
    </div>
  </nav>

  <main>
    <h1 style="margin: 10px 0 6px;">Hazmat ShipStation Orders</h1>

    <!-- Sender address -->
    <div class="group" style="margin: 6px 0 2px;">
      <label class="small">Sender Address:</label>
      <select id="addressSelect">
        <option value="williamstown">Williamstown, NJ (Default)</option>
        <option value="colorado">Englewood, CO</option>
        <option value="florida">Jacksonville, FL</option>
      </select>
      <span id="selected-count" class="muted">0 rows selected</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="group">
          <label class="small">Quick Filter:</label>
          <div class="chips" id="warehouseChips">
            <div class="chip active" data-warehouse="all">All</div>
            <div class="chip" data-warehouse="jersey">NJ</div>
            <div class="chip" data-warehouse="colorado">CO</div>
            <div class="chip" data-warehouse="florida">FL</div>
          </div>
        </div>
        <div class="group">
          <label class="small">Search:</label>
          <input id="globalSearch" type="text" placeholder="Order #, customer, state, item…" />
        </div>
      </div>
      <div class="actions">
        <button id="selectVisibleBtn" title="Toggle select all visible rows">Select All Visible</button>
        <button class="btn btn-primary" id="export-btn">Export FedEx CSV</button>
      </div>
    </div>

    <div id="hot-container"></div>

    <div class="footer">
      <div>Tip: Shift-click to select a range. Ctrl/⌘-click to toggle rows. Sorting & filtering won’t break selection.</div>
      <div id="stats" class="muted"></div>
    </div>
  </main>

  <!-- deps -->
  <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/min/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/handsontable@11.1.0/dist/handsontable.full.min.js"></script>

  <script>
    // === CONFIG (unchanged back-end expectations) ===
    const tagId = 30829;
    const warehouseMap = {
      248943: 'jersey',
      248944: 'colorado',
      256346: 'florida', // NEW
    };
const chipToAddress = {
  jersey:   'williamstown', // NJ chip picks Williamstown address
  colorado: 'colorado',
  florida:  'florida'
};


    const addresses = {
      williamstown: {
        senderContactName: 'Tim Marker',
        senderLine1: '1041 GLASSBORO ROAD',
        senderLine2: 'STE A3',
        senderPostcode: '08094',
        senderCity: 'WILLIAMSTOWN',
        senderState: 'NJ'
      },
      colorado: {
        senderContactName: 'Tim Marker / CHRIS QUEZADA',
        senderLine1: '2879 S SANTA FE DRIVE',
        senderLine2: 'UNIT A',
        senderPostcode: '80110',
        senderCity: 'ENGLEWOOD',
        senderState: 'CO'
      },
      florida: {
        senderContactName: 'Tim Marker / ERIC BRIKSA',
        senderLine1: '5317 FAIRMONT ST',
        senderLine2: '',
        senderPostcode: '32207',
        senderCity: 'JACKSONVILLE',
        senderState: 'FL'
      }
    };

    // ===== helpers =====
    const getCurrentAddress = () => addresses[document.getElementById('addressSelect').value];
    function parsePhoneNumber(phoneRaw) {
      if (!phoneRaw) return { number: '', extension: '' };
      const extMatch = phoneRaw.match(/(.+?)\s*(?:ext\.?|extension|x)\s*(\d+)/i);
      if (extMatch) {
        const basePhone = extMatch[1];
        const extension = extMatch[2];
        const cleanPhone = basePhone.replace(/\D/g, '').replace(/^1/, '');
        return { number: cleanPhone, extension };
      }
      return { number: phoneRaw.replace(/\D/g, '').replace(/^1/, ''), extension: '' };
    }
    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr);
      const msDay = 86400000;
      const todayMid = new Date(); todayMid.setHours(0,0,0,0);
      const dueMid = new Date(d); dueMid.setHours(0,0,0,0);
      return Math.round((dueMid - todayMid) / msDay);
    }
    function badgeForDays(days) {
      if (!Number.isInteger(days)) return '';
      if (days < 0)  return `<span class="badge overdue">${Math.abs(days)}d overdue</span>`;
      if (days === 0) return `<span class="badge today">due today</span>`;
      return `<span class="badge soon">due in ${days}d</span>`;
    }

    // ===== CSV builder (unchanged) =====
    function convertOrdersToFedExCSV(orders) {
      const headers = [
        "serviceType","shipmentType",
        "senderContactName","senderCompany","senderContactNumber",
        "senderLine1","senderLine2","senderPostcode","senderCity",
        "senderState","senderCountry","senderEmail",
        "recipientContactName","recipientContactNumber","recipientPhoneExtension",
        "recipientLine1","recipientPostcode",
        "recipientCity","recipientState","recipientCountry",
        "recipientEmail","numberOfPackages",
        "packageWeight","weightUnits",
        "length","width","height",
        "packageType","currencyType","reference"
      ];
      headers.push("poNumber", "invoiceNumber");
      let csv = headers.join(",") + "\n";

      const senderContactNum = '6096667263';
      const senderCountry = 'US';
      const senderEmail = 'sales@ezpools.com';
      const shipmentType = 'OUTBOUND';
      const packageType = 'YOUR_PACKAGING';
      const currencyType = 'USD';

      const currentAddress = getCurrentAddress();
      const senderCompany  = `EZ POOLS LLC - ${currentAddress.senderState}`;

      orders.forEach(o => {
        const s = o.shipTo;
        const weightLbs = Math.ceil(o.weight.value / 16);
        const phoneInfo = parsePhoneNumber(s.phone);
        const row = [
          o.serviceCode.toUpperCase(),
          shipmentType,
          currentAddress.senderContactName,
          senderCompany,
          senderContactNum,
          currentAddress.senderLine1,
          currentAddress.senderLine2,
          currentAddress.senderPostcode,
          currentAddress.senderCity,
          currentAddress.senderState,
          senderCountry,
          senderEmail,
          s.name,
          phoneInfo.number,
          phoneInfo.extension,
          s.street1,
          s.postalCode.replace("-",""),
          s.city,
          s.state,
          s.country,
          o.customerEmail,
          "1",
          weightLbs,
          "LBS",
          o.dimensions.length,
          o.dimensions.width,
          o.dimensions.height,
          packageType,
          currencyType,
          o.reference || "",
          o.orderNumber || "",
          o.orderId || ""
        ];
        csv += row.join(",") + "\n";
      });

      return csv;
    }

    // ===== app state =====
    let tableData = [];
    let hot = null;
    let lastAnchorPhysical = null;

    // ===== load + map orders (backend unchanged) =====
    async function loadOrders() {
      const res = await fetch(`/hazmat/orders?tagId=${tagId}`, { credentials: 'same-origin' });
      if (!res.ok) { console.error('Fetch error', res.status, await res.text()); return; }
      const orders = await res.json();
      const now = Date.now();

      function getAutoReference(itemSkus) {
        if (itemSkus.some(sku => /champion/i.test(sku))) return 'CHAMPION';
        if (itemSkus.some(sku => /refresh/i.test(sku)))  return 'REFRESH';
        if (itemSkus.includes('71266'))                  return 'GLB AQUA SILK';
        return '';
      }

      tableData = orders.map(o => {
        const skus = o.items.map(i => i.sku);
        const shipBy = o.shipByDate || o.requestedShippingService?.shipByDate || o.orderDate || '';
        return {
          select: false,
          orderNumber: o.orderNumber,
          warehouse: warehouseMap[o.advancedOptions.warehouseId] || o.advancedOptions.warehouseId,
          shipmentAge: Math.ceil((now - new Date(o.createDate).getTime()) / 3600000),
          items: skus.join(', '),
          state: o.shipTo.state,
          customer: o.shipTo.name,
          reference: getAutoReference(skus),
          shipBy,               // NEW (for UI)
          shipByDays: daysUntil(shipBy), // NEW (for badge)
          raw: o
        };
      });

      // backend side-effect (unchanged)
      await Promise.all(orders.map(o => {
        return fetch(`/search/hazmat/update_db?orderId=${encodeURIComponent(o.orderId)}&warehouseId=${encodeURIComponent(o.advancedOptions.warehouseId)}`, { credentials: 'same-origin' })
          .then(r => { if (!r.ok) throw new Error(`${r.status}: ${r.statusText}`); return r.json(); })
          .then(json => console.log('✅ updated', json))
          .catch(err => console.error('❌ update failed for', o.orderId, err));
      }));

      initTable();
      applyWarehouseChip('all'); // default
      updateStats();
    }

    // ===== table init (robust selection + filters/sort + ship-by badges) =====
    function initTable() {
      const container = document.getElementById('hot-container');
      if (hot) { hot.destroy(); hot = null; }

      hot = new Handsontable(container, {
        data: tableData,
        licenseKey: 'non-commercial-and-evaluation',
        width: '100%',
        height: 520,
        stretchH: 'all',
        rowHeaders: true,

        colHeaders(col) {
          const headers = [
            '<input type="checkbox" id="hdr-select-all" title="Select all visible"/>',
            'Order #','Warehouse','Ship-By','Items','State','Customer','Reference','Shipment Age (h)'
          ];
          return headers[col];
        },

        columns: [
          { data: 'select', type: 'checkbox', width: 80 }, // 0
          { // 1 - order link
            data: 'orderNumber', width: 140,
            renderer(instance, td, row, col, prop, value) {
              td.innerHTML = `<a href="https://sellercentral.amazon.com/messaging/contact?orderID=${value}&marketplaceID=ATVPDKIKX0DER" target="_blank" rel="noopener">${value}</a>`;
              td.style.whiteSpace = 'nowrap';
              return td;
            }
          },
          { data: 'warehouse', width: 90 },
          { // 8 - ship-by pretty
            data: 'shipBy', width: 150,
            renderer(instance, td, row) {
              const p = instance.toPhysicalRow(row);
              const src = p != null ? instance.getSourceDataAtRow(p) : null;
              const value = src?.shipBy || '';
              const days  = src?.shipByDays;
              if (!value) { td.textContent = ''; return td; }
              const d = new Date(value);
              const pretty = isNaN(d) ? value : d.toLocaleDateString();
              td.innerHTML = `${badgeForDays(days)} <span style="opacity:.8">${pretty}</span>`;
              return td;
            }
          },                // 2
          { data: 'items', width: 250 },                   // 4
          { data: 'state', width: 60 },                    // 5
          { data: 'customer', width: 170 },                // 6
          { data: 'reference', editor: 'text', width: 130 }, // 7
          { data: 'shipmentAge', type: 'numeric', width: 120 }, // 3
        ],

        // QOL features
        dropdownMenu: true,
        filters: true,
        columnSorting: { initialConfig: [{ column: 8, sortOrder: 'asc' }] },
        multiColumnSorting: true,
        manualColumnResize: true,
        outsideClickDeselects: false,
        search: true,

        // Robust selection: only mutate selection when clicking the checkbox column
        beforeOnCellMouseDown(event, coords) {
          if (coords.row < 0) return;
          if (coords.col !== 0) return; // only handle clicks on checkbox column

          const vRow = coords.row;
          const pRow = hot.toPhysicalRow(vRow);
          if (pRow == null) return;

          // Shift range select
          if (event.shiftKey && lastAnchorPhysical != null) {
            const anchorV = hot.toVisualRow(lastAnchorPhysical);
            if (anchorV != null) {
              const [startV, endV] = [anchorV, vRow].sort((a,b)=>a-b);
              for (let v = startV; v <= endV; v++) {
                const p = hot.toPhysicalRow(v);
                if (p != null) tableData[p].select = true;
              }
            }
            hot.render(); updateSelectedCount(); event.stopImmediatePropagation(); event.preventDefault(); return false;
          }

          // Ctrl/Meta toggles only clicked row
          if (event.ctrlKey || event.metaKey) {
            tableData[pRow].select = !tableData[pRow].select;
            lastAnchorPhysical = pRow;
            hot.render(); updateSelectedCount(); event.stopImmediatePropagation(); event.preventDefault(); return false;
          }

          // Plain click = single select
          tableData.forEach(r => r.select = false);
          tableData[pRow].select = true;
          lastAnchorPhysical = pRow;
          hot.render(); updateSelectedCount(); event.stopImmediatePropagation(); event.preventDefault(); return false;
        },

        afterGetColHeader(col, TH) {
          if (col !== 0) return;
          const box = TH.querySelector('#hdr-select-all');
          if (box && !box.dataset.bound) {
            box.dataset.bound = '1';
            box.addEventListener('click', () => {
              const checked = box.checked;
              // iterate visible rows only
              const count = hot.countRows();
              for (let v = 0; v < count; v++) {
                const p = hot.toPhysicalRow(v);
                if (p != null) tableData[p].select = checked;
              }
              hot.render(); updateSelectedCount();
            });
          }
        },

        afterColumnSort() { fixAnchor(); },
        afterFilter() { fixAnchor(); },
      });

      // global search input -> Handsontable search plugin (highlight + quick filter via filters)
      const searchInput = document.getElementById('globalSearch');
      const searchPlugin = hot.getPlugin('search');
      const filtersPlugin = hot.getPlugin('filters');

      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim();
        // highlight
        searchPlugin.query(q);
        // quick filter across a few columns (order #, customer, state, items)
        filtersPlugin.clearConditions();
        if (q) {
          filtersPlugin.addCondition(1, 'contains', [q]); // order #
          filtersPlugin.addCondition(4, 'contains', [q], 'disjunction'); // items
          filtersPlugin.addCondition(5, 'contains', [q], 'disjunction'); // state
          filtersPlugin.addCondition(6, 'contains', [q], 'disjunction'); // customer
        }
        filtersPlugin.filter();
        updateSelectedCount();
        updateStats();
      });

      // Select all visible button (toggles: if any unchecked => select all, else clear all)
      document.getElementById('selectVisibleBtn').addEventListener('click', () => {
        const visibleRows = Array.from({length: hot.countRows()}, (_, v) => hot.toPhysicalRow(v)).filter(p => p != null);
        const anyUnchecked = visibleRows.some(p => !tableData[p].select);
        visibleRows.forEach(p => tableData[p].select = anyUnchecked);
        hot.render(); updateSelectedCount();
      });
    }

    function fixAnchor() {
      if (lastAnchorPhysical != null && hot.toVisualRow(lastAnchorPhysical) == null) {
        lastAnchorPhysical = null;
      }
      updateSelectedCount();
      updateStats();
    }

    function updateSelectedCount() {
      document.getElementById('selected-count').textContent =
        tableData.filter(r => r.select).length + ' rows selected';
    }

    function updateStats() {
      const total = hot ? hot.countRows() : 0;
      const overdueVisible = [];
      for (let v = 0; v < total; v++) {
        const p = hot.toPhysicalRow(v);
        if (p == null) continue;
        const d = tableData[p].shipByDays;
        if (Number.isInteger(d) && d < 0) overdueVisible.push(p);
      }
      document.getElementById('stats').textContent =
        `${total} visible • ${overdueVisible.length} overdue`;
    }

    // ===== warehouse chips → filters plugin =====
function applyWarehouseChip(value) {
  const filters = hot.getPlugin('filters');
  const q = document.getElementById('globalSearch').value.trim();

  // 1) Apply filters (warehouse + current text search)
  filters.clearConditions();
  if (value !== 'all') {
    filters.addCondition(2, 'eq', [value]); // warehouse column index 2
  }
  if (q) {
    filters.addCondition(1, 'contains', [q], 'disjunction'); // order #
    filters.addCondition(4, 'contains', [q], 'disjunction'); // items
    filters.addCondition(5, 'contains', [q], 'disjunction'); // state
    filters.addCondition(6, 'contains', [q], 'disjunction'); // customer
  }
  filters.filter();

  // 2) Sync the sender address dropdown when chip is NJ/CO/FL
  const addrSel = document.getElementById('addressSelect');
  if (value in chipToAddress) {
    addrSel.value = chipToAddress[value];
    // (optional) if you have any on-change side effects, trigger them:
    // addrSel.dispatchEvent(new Event('change'));
  }

  // 3) Clear all row selections + header checkbox
  tableData.forEach(r => r.select = false);
  const hdr = document.querySelector('#hdr-select-all');
  if (hdr) hdr.checked = false;

  // 4) Update chip UI + table
  document.querySelectorAll('#warehouseChips .chip').forEach(el => {
    el.classList.toggle('active', el.dataset.warehouse === value);
  });
  hot.render();
  updateSelectedCount();
  updateStats();
}


    document.getElementById('warehouseChips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      applyWarehouseChip(chip.dataset.warehouse);
    });

    // ===== export (unchanged path/format) =====
document.getElementById('export-btn').addEventListener('click', () => {
  if (!hot) return;

  const selectedOrders = tableData
    .filter(row => row.select)
    .map(row => {
      row.raw.reference = row.reference; // keep existing behavior
      return row.raw;
    });

  if (!selectedOrders.length) {
    alert('No rows selected!');
    return;
  }

  const csvData = convertOrdersToFedExCSV(selectedOrders);
  const rn = moment().format("MM-DD-YYYY_HH_mm");
  const location_selected = document.getElementById('addressSelect').value;

  const blob = new Blob([csvData], { type: 'text/csv' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${location_selected}_fedex_batch_${rn}.csv`; // ← here
  link.click();
});


    // boot
    loadOrders().catch(console.error);
  </script>
</body>
</html>
